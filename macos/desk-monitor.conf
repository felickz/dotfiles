# Prefer the DDPM CLI already installed on this Mac. "auto" falls back to m1ddc
# when DDPM is unavailable.
DESK_MONITOR_BACKEND=auto

# Which display to drive. "auto" uses the only DDC-capable display when this Mac can see
# just one, which is the normal case here - the Mac is USB-C to a single monitor. Set a
# concrete index (DDPM reports the P2725DE as 1) or a m1ddc identifier to pin it, or pass
# one on the command line: "desk-monitor pc 2".
DESK_MONITOR_DISPLAY=auto

# DDPM source names and equivalent MCCS VCP 0x60 values for the m1ddc fallback.
DESK_MONITOR_MAC_SOURCE=USB-C
DESK_MONITOR_PC_SOURCE=DP
DESK_MONITOR_MAC_INPUT=27
DESK_MONITOR_PC_INPUT=15
